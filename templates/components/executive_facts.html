<div class="card {{ section.layout_class }}">
  {% import "_evidence_flag.html" as ev %}
  <div class="card-title">{{ section.title or "Executive Facts" }}{{ ev.flag(section.evidence_status) }}</div>
  <ul class="fact-list">
    {% for f in section.facts %}
    <li>{{ f.statement }}{{ ev.flag(f.evidence_status) }}</li>
    {% endfor %}
  </ul>
</div>
