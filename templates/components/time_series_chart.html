<div class="card {{ section.layout_class }}">
  <div class="card-title">{{ section.title }}</div>
  <div class="chart-caption">{{ section.unit }}</div>
  <svg width="100%" height="260" viewBox="0 0 720 260">
    {% for gy, glabel in section.gridlines %}
    <line x1="30" y1="{{ gy }}" x2="700" y2="{{ gy }}" stroke="#f0f1f3" stroke-width="1"/>
    <text class="axis-label" x="0" y="{{ gy + 4 }}">{{ glabel }}</text>
    {% endfor %}
    {% for cx, clabel in section.cat_ticks %}
    <text class="axis-label" x="{{ cx }}" y="252" text-anchor="middle">{{ clabel }}</text>
    {% endfor %}
    {% for s in section.series %}
    <polyline points="{{ s.points }}" fill="none" stroke="{{ s.color }}" stroke-width="2.5"/>
    {% for px, py in s.dot_points %}
    <circle cx="{{ px }}" cy="{{ py }}" r="3.5" fill="{{ s.color }}"/>
    {% endfor %}
    <text class="bar-value" x="705" y="{{ s.last_y + 4 }}" fill="{{ s.color }}">{{ s.last_label }}</text>
    {% endfor %}
  </svg>
</div>
